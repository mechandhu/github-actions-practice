name: my-first-workflow
#to get a trigger on every push in this repo on any branch
on:
  push:

jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest
    steps:
      - name: Step1
        run: |
          pwd
          ls -lrt
          hostname
      - name: Step -2 Checkout
        uses: actions/checkout@v5.0.0
        
      - name: Step -3
        run: |
          echo `pwd` >> myartifact.txt
          mkdir artifacts
          echo `ls -lrt` >> artifacts/list.tst
          echo `hostname` >> artifacts/histname.txt
          hostname
          
      - name: Upload a single file
        uses: actions/upload-artifact@v7.0.0
        with:
          name: single_file
          path: ./myartifact.txt
      - name: Upload from directory
        uses: actions/upload-artifact@v7.0.0
        with:
          name: directory_artifacts
          path: artifacts/

      - name: Uploading multiple files
        uses: actions/upload-artifact@v7.0.0
        with:
          name: multiple_paths
          path: |
            ./myartifact.txt
            artifacts/
            
      - name: Uploading multiple files with exclusion
        uses: actions/upload-artifact@v7.0.0
        with:
          name: multiple_paths_with_exclusion
          path: |
            ./myartifact.txt
            artifacts/
            !**/hostname.txt

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: multiple_paths_with_exclusion
          path: ./downloads
  job2:
    name: JOB2
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: Checking current directory
        run: |
          mkdir builds
          pwd
          ls -lrt
      - name: Download single file artifact
        uses: actions/download-artifact@v8
        with:
          name: single_file
          path: ./builds
      - name: Checking current directory post download
        run: |
          pwd
          ls -lrt
